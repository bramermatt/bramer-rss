Theology:
  - title: Knowing God
    author: J. I. Packer
    note: A classic introduction to reverent, practical Christian doctrine.
  - title: The Holiness of God
    author: R. C. Sproul
    note: A clear, memorable study of God's holiness and its implications.
History:
  - title: 1776
    author: David McCullough
    note: A readable account of a pivotal year in the American Revolution.
  - title: Washington: A Life
    author: Ron Chernow
    note: A rich presidential biography with leadership lessons.
Science:
  - title: The Disappearing Spoon
    author: Sam Kean
    note: A lively history of chemistry through the periodic table.
  - title: A Brief History of Time
    author: Stephen Hawking
    note: A landmark popular treatment of cosmology and big questions.
Fantasy:
  - title: The Fellowship of the Ring
    author: J. R. R. Tolkien
    note: The beginning of the modern fantasy epic and a deep moral imagination.
  - title: The Lion, the Witch and the Wardrobe
    author: C. S. Lewis
    note: A beloved fantasy story full of wonder, courage, and sacrifice.
