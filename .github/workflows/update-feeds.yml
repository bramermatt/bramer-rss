name: Update RSS Feed

on:
  schedule:
    - cron: "0 10,16,22 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Update Articles
        run: node updateFeeds.js

      - name: Commit Changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add articles.json

          git diff --staged --quiet || git commit -m "Update articles"

          git push
